# See ../../schema/poc.schema.json and ../../SAFETY.md.
id: mouse-tracking-reflection
title: "DECSET mouse tracking: mouse events reflected onto the child's stdin"
class: mouse-tracking-reflection
cve: []
affected:
  - product: "xterm-family terminals implementing mouse reporting (1000/1002/1003 + 1006)"
    tested: false
author: "(project-authored demonstration; class documented in xterm ctlseqs)"
source_url: "https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
archive_url: "http://web.archive.org/web/20260826142350/https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
date: "2020"
severity: injection
mechanism: decset-mouse-report
verification: mouse-tracking-reflection
payload_encoding: hex
expected_effect: >-
  Program output can enable xterm mouse tracking (DECSET ?1003h any-event + ?1006h
  SGR extended). Reporting a REAL user mouse event is a standard feature (xterm,
  konsole and secure-terminal all answer with an ESC[<...M/m report when the user
  actually clicks or scrolls) -- that is the user's own action, not injection. The
  vuln this class guards is OUTPUT fabricating input: a write-back caused by the
  enable sequence ITSELF, with no user action. secure-terminal writes nothing from
  the enable sequence alone (only genuine user events report, and Shift keeps an
  event local), so output cannot inject.
canary: "ESC[<...M mouse report written from the enable sequence alone (no user event)"
modified: false
notes: >-
  Oracle: feed the DECSET mouse-enable payload and spy _write with NO pointer event
  posted. A hit = any write-back from output alone. Reporting a real user event and
  Shift-locality are the terminal's own feature/invariant, checked in its suite.

id: alt-screen-hijack
title: "An unrestored alternate-screen switch leaves a terminal stuck full-screen"
class: alt-screen-hijack
cve: []
affected:
  - product: "terminals honouring the alternate-screen private modes (?1049/?1047/?47)"
    tested: false
author: "(project-authored demonstration; class documented in xterm ctlseqs)"
source_url: "https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
archive_url: "http://web.archive.org/web/20260826142350/https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
date: "2024"
severity: dos
mechanism: alt-screen-no-restore
payload_encoding: hex
verification: screen-hijack
expected_effect: >-
  A switch to the alternate screen buffer (ESC [ ?1049h) with no matching restore leaves a
  traditional terminal stuck in a blank full-screen: the prompt is gone and the cursor is
  hidden until `reset`. The canary token is written inside the alternate buffer, so on a
  vulnerable terminal it only shows in the hijacked screen.

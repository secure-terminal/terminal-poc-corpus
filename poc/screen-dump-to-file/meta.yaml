id: screen-dump-to-file
title: "DEC/xterm Media Copy (printer controller) copies the screen to a file"
class: screen-dump-to-file
cve: []
affected:
  - product: "terminals implementing Media Copy / printer-controller mode (DEC/xterm)"
    tested: false
author: "(project-authored demonstration; class documented in xterm ctlseqs)"
source_url: "https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
archive_url: "http://web.archive.org/web/20260826142350/https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
date: "2024"
severity: exfil
mechanism: media-copy-printer-controller
payload_encoding: hex
verification: screen-dump-to-file
expected_effect: >-
  The Media Copy escapes turn the printer controller on (ESC [ 5 i), print the
  screen (ESC [ i) and turn it off (ESC [ 4 i). On a terminal that implements
  printer/Media Copy support, ESC [ 5 i routes the host stream directly to the configured
  printer command or file, silently exfiltrating the payload text directly. secure-terminal has no printer path
  and strips every escape, so no Media Copy sequence survives the render.
canary: "POC-CORPUS-CANARY-FIRED"
modified: false

# Adversarial corpus test against secure-terminal, GitHub CI only (isolated ephemeral
# runners) -- the harness refuses to decode live payloads on a plain host. It leads with
# the --test-canary positive control (fail loud if the machinery is broken) and asserts
# secure-terminal never reflects any corpus PoC back to the pty.
#
# Runs in a debian:trixie-slim container, NOT bare ubuntu-latest. Two reasons:
#   - secure-terminal targets current Debian, which is what the dist-ai reusable
#     tests it on.
#   - ubuntu-24.04 ships python3-wcwidth 0.2.5, whose Unicode data measures a ZWJ
#     emoji sequence as width 6 where 0.2.13 gives 2. pyte's own
#     test_display_multi_char_emoji / test_display_complex_emoji assert the modern
#     width, so Part A of the conformance harness failed on stale distro data
#     rather than on any parser defect -- red since 2026-07-20 for that reason.
name: adversarial-corpus

on:
  push:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    timeout-minutes: 15

permissions:
  contents: read

## One run per ref; a superseded push has nothing to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    timeout-minutes: 30
    steps:
      # actions/checkout needs git present in the container, so this precedes it.
      - name: Install checkout dependencies (apt only)
        run: |
          apt-get update --quiet
          apt-get install --yes --no-install-recommends ca-certificates git
          git config --global --add safe.directory '*'

      - name: Check out the corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check out secure-terminal (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: secure-terminal/secure-terminal
          path: _secure-terminal
      - name: Install dependencies
        # python3-pyqt6.qtmultimedia is REQUIRED, not optional: usr/bin/secure-terminal
        # preflight-checks its runtime dependencies and exits 1 naming the first
        # missing one, so without it the app never starts, --test-canary never fires,
        # and the harness refuses to trust the run.
        run: |
          apt-get install --yes --no-install-recommends \
            python3 python3-pyqt6 python3-pyqt6.qtmultimedia python3-pyte \
            python3-confusable-homoglyphs python3-regex \
            python3-yaml python3-jsonschema python3-pytest \
            build-essential libtool-bin perl pkg-config
      - name: Validate the corpus (schema + sanitization lint)
        run: python3 tools/validate.py
      - name: Positive control + adversarial corpus test
        env:
          SECURE_TERMINAL_REPO: ${{ github.workspace }}/_secure-terminal
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 harness/run.py --self-test
          python3 harness/adversarial.py --self-test
          python3 harness/adversarial.py
      - name: Acquire reviewed conformance suites (pinned SHAs) + run conformance
        env:
          SECURE_TERMINAL_REPO: ${{ github.workspace }}/_secure-terminal
          QT_QPA_PLATFORM: offscreen
        run: |
          ./conformance/acquire.sh --for-tests
          python3 harness/conformance.py
